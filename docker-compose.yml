version: "3.8"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: todo
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      # INTENTIONAL MISCONFIG: app expects DBUSER/DBPASSWORD/DBNAME, but we set POSTGRES_* above
      DBUSER_WRONG: postgres
      DBPASSWORD_WRONG: example
      DBHOST: db
      DBPORT: "5432"
    ports:
      - "3001:3001"
